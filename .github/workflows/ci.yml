name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import smoke + example run
        run: |
          python -c "import agent; assert agent.run('calc 1+2*3') == '7'"
          python -c "import tools; assert tools.web_fetch('ftp://x') == '仅支持 http/https 链接'; assert '文件不存在' in tools.read_file('./no-such-file.txt')"
          python -m py_compile agent.py tools.py examples/demo.py
